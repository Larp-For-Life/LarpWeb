<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Larp For Life · LFL</title>
  <meta name="description" content="Larp For Life (LFL) — larpová skupina.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Larp For Life · LFL">
  <meta property="og:description" content="There's no limit to the larp.">
  <meta property="og:image" content="assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=JetBrains+Mono:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-loading">

  <!-- ===== Atmosféra (pozadí, zrno, kurzor) ===== -->
  <canvas class="fog" id="fog" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="cursor" aria-hidden="true">
    <span class="cursor-dot"></span>
    <span class="cursor-ring"><span class="cursor-label"></span></span>
  </div>

  <!-- ===== Úvodní nahrávání ===== -->
  <div class="loader" id="loader" aria-hidden="true">
    <div class="loader-inner">
      <img class="loader-logo" src="assets/lfl-glow.png" alt="" width="1000" height="1000">
      <div class="loader-meta">
        <span class="loader-count">000</span>
        <span class="loader-line"><span></span></span>
      </div>
    </div>
  </div>

  <!-- ===== Logo vlevo nahoře ===== -->
  <a class="brand" href="#top" aria-label="Larp For Life — nahoru" data-cursor="↑">
    <img src="assets/lfl-glow.png" alt="" width="1000" height="1000">
  </a>

  <div class="rail" aria-hidden="true"><span class="rail-fill"></span></div>

  <main>

    <!-- ===== HERO ===== -->
    <section class="hero" id="top" aria-label="Larp For Life">
      <div class="hero-stage" id="heroStage">
        <h1 class="hero-title" id="heroTitle" aria-label="Larp For Life">
          <span class="word" data-text="LARP"></span>
          <span class="word" data-text="FOR"></span>
          <span class="word" data-text="LIFE"></span>
        </h1>
      </div>
      <div class="hero-ui hero-ui--bl" aria-hidden="true"><span id="clock">00:00:00</span></div>
      <div class="hero-ui hero-ui--br" aria-hidden="true"><span class="scroll-line"><span></span></span></div>
    </section>

    <!-- ===== LARP HLÁŠKY (obsah v js/data.js) — střídají se samy ===== -->
    <section class="sayings" id="hlasky">
      <div class="sayings-stage" id="sayings"></div>
      <div class="sayings-ticks" id="sayingsTicks" aria-hidden="true"></div>
    </section>

    <!-- ===== Pásky ===== -->
    <div class="tapes" aria-hidden="true">
      <div class="tape tape--a"><div class="tape-track" data-speed="1"></div></div>
      <div class="tape tape--b"><div class="tape-track" data-speed="-1"></div></div>
    </div>

    <!-- ===== LARPERS — hranatý mechanismus (členové v js/data.js) ===== -->
    <section class="larpers" id="clenove">
      <h2 class="section-title" data-scramble>Larpers</h2>
      <div class="sigil" id="sigil">
        <div class="sigil-tilt" id="sigilTilt">
          <svg class="sigil-frame" viewBox="0 0 1000 1000" aria-hidden="true">
            <rect class="draw" x="4" y="4" width="992" height="992" pathLength="1"/>
            <rect class="draw draw--late" x="30" y="30" width="940" height="940" pathLength="1"/>
            <rect class="track" x="125" y="125" width="750" height="750"/>
            <g class="marks" id="sigilMarks"></g>
          </svg>
          <div class="sig-rot sig-rot--a" aria-hidden="true"><svg viewBox="0 0 1000 1000"><rect x="265" y="265" width="470" height="470"/><rect x="265" y="265" width="470" height="470" transform="rotate(45 500 500)"/></svg></div>
          <div class="sig-rot sig-rot--b" aria-hidden="true"><svg viewBox="0 0 1000 1000"><rect x="290" y="290" width="420" height="420" transform="rotate(22.5 500 500)"/></svg></div>
          <span class="sigil-link" aria-hidden="true"><i id="sigilPulse"></i></span>
          <button class="altar" id="altar" type="button" data-cursor="+" aria-label="Larpers">
            <span class="altar-photo" id="altarPhoto"><img class="altar-img" alt=""><img class="altar-img" alt=""><span class="altar-scan" id="altarScan"></span></span>
            <img class="altar-logo" src="assets/lfl-glow.png" alt="">
            <span class="altar-num" id="altarNum" aria-hidden="true"></span>
            <span class="altar-corner altar-corner--tl"></span>
            <span class="altar-corner altar-corner--tr"></span>
            <span class="altar-corner altar-corner--bl"></span>
            <span class="altar-corner altar-corner--br"></span>
            <span class="altar-name" aria-hidden="true"><span class="an-first" id="altarFirst"></span><span class="an-nick" id="altarNick"></span><span class="an-last" id="altarLast"></span></span>
          </button>
          <div class="sigil-tiles" id="sigilTiles"></div>
          <span class="sigil-gate" id="sigilGate" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="sigil-spark" aria-hidden="true"></span>
          <span class="sigil-spark sigil-spark--b" aria-hidden="true"></span>
        </div>
      </div>
    </section>

    <!-- ===== Blikající LFL ===== -->
    <div class="signs" id="signs" aria-hidden="true">
      <div class="signs-track" id="signsTrack"></div>
    </div>

  </main>

  <!-- ===== KONTAKT / PATIČKA ===== -->
  <footer class="footer" id="kontakt">
    <h2 class="footer-title" id="footerTitle" aria-label="Larpuj">Larpuj</h2>

    <ul class="contacts" id="contacts"></ul>

    <div class="footer-logo" id="footerLogo" aria-hidden="true">
      <img class="footer-logo-base" src="assets/lfl-glow.png" alt="" width="1000" height="1000" loading="lazy">
      <img class="footer-logo-lit" src="assets/lfl-glow.png" alt="" width="1000" height="1000" loading="lazy">
    </div>

    <div class="footer-bottom">
      <span>© <span id="year">2026</span> Larp For Life</span>
      <button class="icon-btn to-top" id="toTop" type="button" aria-label="Nahoru" data-cursor="↑">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </div>
  </footer>

  <!-- ===== Detail člena ===== -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <button class="icon-btn modal-close" type="button" data-close aria-label="Zavřít" data-cursor="×">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="modal-shell" role="dialog" aria-modal="true" aria-labelledby="modalName">
      <div class="modal-media" id="modalMedia">
        <img id="modalImg" alt="">
        <span class="modal-num" id="modalNum">I</span>
        <span class="modal-corner modal-corner--tl"></span>
        <span class="modal-corner modal-corner--tr"></span>
        <span class="modal-corner modal-corner--bl"></span>
        <span class="modal-corner modal-corner--br"></span>
      </div>
      <div class="modal-body">
        <h3 class="modal-name m-in" id="modalName">
          <span class="mn-first" id="modalFirst"></span>
          <span class="mn-nick" id="modalNick"></span>
          <span class="mn-last" id="modalLast"></span>
        </h3>
        <blockquote class="modal-quote m-in" id="modalQuote"></blockquote>
        <p class="modal-bio m-in" id="modalBio"></p>
        <dl class="modal-facts m-in" id="modalFacts"></dl>
        <div class="modal-deck m-in" id="modalDeck">
          <button class="icon-btn deck-arrow deck-arrow--prev" id="modalPrev" type="button" aria-label="Předchozí člen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
          </button>
          <div class="deck" id="deck"></div>
          <button class="icon-btn deck-arrow deck-arrow--next" id="modalNext" type="button" aria-label="Další člen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
